
name: Build Employee Management

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish WPF application
        run: >
          dotnet publish EMP_record_management.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o ./publish

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Employee-Management-Windows
          path: ./publish/
